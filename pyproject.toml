[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "MP_ACID"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pillow>=12.3.0",
    "plotly>=6.9.0",
    "polars>=1.43.1",
    "torch>=2.2",
    "lpips>=0.1.4,<0.2",
    "bertopic>=0.17.4",
    "xlsxwriter>=3.2.9",
    "sentence-transformers>=6.0.1",
    "spacy>=3.8.16",
    "opencv-python>=5.0.0.93",
    "opencv-python-headless>=5.0.0.93",
]

[project.scripts]
create-pipeline = "Shared_Functions.Pipeline_Functions.pipeline_generator:main"
clear-pipeline = "Shared_Functions.Pipeline_Functions.wipe_pipeline_data:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["Shared_Functions*"]
